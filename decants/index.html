<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decants — Maison Zadaca</title>
  <meta name="description" content="Perfumes originales en decant: fracciones de 3ml, 5ml y 10ml para probar antes de comprar la botella completa." />
  <link rel="canonical" href="https://madisonzadaca.com/decants/" />
  <link rel="icon" type="image/png" href="https://madisonzadaca.com/assets/img/brand/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maison Zadaca" />
  <meta property="og:title" content="Decants — Maison Zadaca" />
  <meta property="og:description" content="Perfumes originales en decant: fracciones de 3ml, 5ml y 10ml para probar antes de comprar la botella completa." />
  <meta property="og:url" content="https://madisonzadaca.com/decants/" />
  <meta property="og:image" content="https://madisonzadaca.com/assets/img/brand/logo-og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Decants — Maison Zadaca" />
  <meta name="twitter:description" content="Perfumes originales en decant: fracciones de 3ml, 5ml y 10ml para probar antes de comprar la botella completa." />
  <meta name="twitter:image" content="https://madisonzadaca.com/assets/img/brand/logo-og.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://madisonzadaca.com/assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="https://madisonzadaca.com/">Inicio</a> / Decants</div>
        <h1>Decants</h1>
      </div>
    </div>

    <section class="section-tight">
      <div class="container">
        <p style="max-width:680px; color:var(--color-text-muted); font-size:0.95rem;">
          Fracciones de perfumes originales en <strong style="color:var(--color-gold)">3ml, 5ml y 10ml</strong> — ideales para probar una fragancia antes de llevar la botella completa. Cada tamaño tiene su propio precio y stock.
        </p>
      </div>
    </section>

    <section class="section" style="padding-top:24px;">
      <div class="container">
        <div class="pill-row" id="decants-generos" style="margin-bottom:18px;">
          <button type="button" class="pill active" data-genero="">Todos</button>
          <button type="button" class="pill" data-genero="Hombre">Hombre</button>
          <button type="button" class="pill" data-genero="Mujer">Mujer</button>
          <button type="button" class="pill" data-genero="Unisex">Unisex</button>
        </div>
        <div class="decants-toolbar">
          <input type="search" id="decants-busqueda" placeholder="Perfume, marca o el que te gusta (ej. Sauvage)" autocomplete="off" aria-label="Buscar decants" />
          <select id="decants-casa" aria-label="Tipo de casa">
            <option value="">Todas las casas</option>
            <option value="Diseñador">Diseñador</option>
            <option value="Nicho">Nicho</option>
            <option value="Árabe">Árabe</option>
          </select>
          <select id="decants-aroma" aria-label="Aroma"><option value="">Todos los aromas</option></select>
          <select id="decants-precio" aria-label="Precio">
            <option value="">Cualquier precio</option>
            <option value="0-15">Desde S/ 15 o menos</option>
            <option value="15-25">Desde S/ 15 a S/ 25</option>
            <option value="25-">Desde más de S/ 25</option>
          </select>
          <select id="decants-orden" aria-label="Ordenar">
            <option value="">Destacados</option>
            <option value="precio_asc">Precio: menor a mayor</option>
            <option value="precio_desc">Precio: mayor a menor</option>
            <option value="nombre">Nombre A-Z</option>
          </select>
          <span class="decants-conteo" id="decants-conteo"></span>
        </div>
        <div class="product-grid reveal-grid" id="grid-decants"><div class="loading-state">Cargando decants…</div></div>
        <div class="pagination" id="paginacion"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://madisonzadaca.com/assets/js/supabase-config.js" defer></script>
  <script src="https://madisonzadaca.com/assets/js/api.js" defer></script>
  <script src="https://madisonzadaca.com/assets/js/main.js" defer></script>
  <script src="https://madisonzadaca.com/assets/js/decants.js" defer></script>
</body>
</html>
