<head>

  <meta name="description" id="page-description" content="Perfumes originales importados — Maison Zadaca." />
  <link rel="canonical" id="canonical-link" href="https://lincolnhm.github.io/Zadaca/producto/" />
  <link rel="icon" type="image/png" href="https://lincolnhm.github.io/Zadaca/assets/img/brand/favicon.png" />
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="Maison Zadaca" />
  <meta property="og:title" id="og-title" content="Maison Zadaca" />
  <meta property="og:description" id="og-description" content="Perfumes originales importados — Maison Zadaca." />
  <meta property="og:image" id="og-image" content="https://lincolnhm.github.io/Zadaca/assets/img/brand/logo-og.jpg" />
  <meta property="og:url" id="og-url" content="https://lincolnhm.github.io/Zadaca/producto/" />
  <meta name="twitter:card" id="twitter-card" content="summary" />
  <meta name="twitter:title" id="twitter-title" content="Maison Zadaca" />
  <meta name="twitter:description" id="twitter-description" content="Perfumes originales importados — Maison Zadaca." />
  <meta name="twitter:image" id="twitter-image" content="https://lincolnhm.github.io/Zadaca/assets/img/brand/logo-og.jpg" />
  <script type="application/ld+json" id="product-jsonld"></script>
  <link rel="stylesheet" href="https://lincolnhm.github.io/Zadaca/assets/css/style.css" />
  <style>
    .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
    @media (max-width: 860px) { .product-detail { grid-template-columns: 1fr; gap: 32px; } }
    .pd-media { aspect-ratio: 3/4; border-radius: var(--radius); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; background: var(--color-media-bg); }
    .pd-media img { max-width: 78%; max-height: 82%; object-fit: contain; }
    .pd-brand { color: var(--color-gold); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; }
    .pd-name { font-size: 2rem; margin: 6px 0 10px; }
    .pd-price { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    .pd-price .price-current { font-size: 1.7rem; }
    .pd-consolidado-note { font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 22px; }
    .pd-consolidado-note strong { color: var(--color-gold); }
    .pd-meta-row { display: flex; gap: 24px; margin: 20px 0; font-size: 0.82rem; color: var(--color-text-muted); flex-wrap: wrap; }
    .pd-meta-row strong { color: var(--color-text); display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .qty-selector { display: flex; align-items: center; border: 1px solid var(--color-border); border-radius: var(--radius); width: fit-content; }
    .qty-selector button { background: none; border: none; color: var(--color-text); width: 38px; height: 42px; }
    .qty-selector input { width: 44px; text-align: center; background: none; border: none; color: var(--color-text); font-size: 0.95rem; }
    .pd-actions { display: flex; align-items: center; gap: 14px; margin: 26px 0; flex-wrap: wrap; }
    .pd-tabs-content { border-top: 1px solid var(--color-border); padding-top: 24px; margin-top: 24px; }
    .pd-tabs-content h4 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-gold); margin-bottom: 10px; }
    .pd-tabs-content p { color: var(--color-text-muted); font-size: 0.92rem; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="https://lincolnhm.github.io/Zadaca/">Inicio</a> / <a href="https://lincolnhm.github.io/Zadaca/catalogo/">Catálogo</a> / <span id="crumb-nombre">Producto</span></div>
      </div>
    </div>

    <section class="section" id="detalle-mount">
      <div class="container"><div class="loading-state">Cargando producto…</div></div>
    </section>

    <section class="section reveal" style="padding-top:0; display:none;" id="relacionados-section">
      <div class="container">
        <div class="section-header"><h2>También te puede interesar</h2></div>
        <div class="product-grid reveal-grid" id="grid-relacionados"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/supabase-config.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/api.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/main.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/producto.js"></script>
</body>
</html>
