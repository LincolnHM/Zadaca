  <link rel="stylesheet" href="https://madisonzadaca.com/assets/css/style.css" />
  <style>
    /* Recorta el padding vertical del bloque de producto (el .section global es 72px arriba y
       abajo, pensado para secciones largas del home) para que la ficha entre con menos scroll. */
    #detalle-mount { padding: 32px 0; }
    .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
    @media (max-width: 860px) { .product-detail { grid-template-columns: 1fr; gap: 32px; } }
    /* Antes era 3/4 (bien vertical) -- con un cuadro casi cuadrado la foto ocupa bastante menos
       alto sin achicarla de más, y de paso deja el detalle más corto de scrollear. */
    .pd-media { aspect-ratio: 1/1; max-height: 460px; border-radius: var(--radius); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; background: var(--color-media-bg); }
    .pd-media img { max-width: 78%; max-height: 82%; object-fit: contain; }
    .pd-brand { color: var(--color-chrome-dim); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; }
    .pd-name { font-size: 1.9rem; margin: 4px 0 8px; }
    .pd-price { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    .pd-price .price-current { font-size: 1.6rem; }
    .pd-consolidado-note { font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 16px; }
    .pd-consolidado-note strong { color: var(--color-chrome-dim); }
    /* "Inspirado en": mismo criterio de venta que trae el catálogo impreso (comparar contra un
       perfume de diseñador conocido) -- se resalta como su propia línea, no metida en la
       descripción, porque es lo primero que un cliente que ya conoce el original busca. */
    .pd-inspired { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--color-text-muted); margin: 2px 0 16px; }
    .pd-inspired strong { color: var(--color-text); }
    .pd-inspired svg { width: 15px; height: 15px; color: var(--color-gold); flex-shrink: 0; }
    /* Notas olfativas como pills de solo lectura -- mismo look que .pill de los filtros rápidos
       pero sin estados de hover/click, porque acá no filtran nada. */
    .note-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill-note {
      padding: 6px 14px; border-radius: 30px; font-size: 0.76rem; letter-spacing: 0.02em;
      border: 1px solid var(--color-border); background: var(--color-bg-alt); color: var(--color-text-muted);
    }
    /* Franja de sellos de confianza bajo los botones de acción -- mismo lenguaje visual que
       .info-icon/.feature-item del home (círculo tenue burdeos + ícono), en una fila compacta
       pensada para la columna angosta de la ficha en vez del strip de ancho completo. */
    .trust-row { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--color-border); }
    .trust-item { display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: var(--color-text-muted); }
    .trust-item span:first-child {
      width: 34px; height: 34px; border-radius: 50%; background: rgba(122,32,48,0.08);
      display: flex; align-items: center; justify-content: center; color: var(--color-gold); flex-shrink: 0;
    }
    .trust-item span:first-child svg { width: 17px; height: 17px; }
    .pd-meta-row { display: flex; gap: 24px; margin: 14px 0; font-size: 0.82rem; color: var(--color-text-muted); flex-wrap: wrap; }
    .pd-meta-row strong { color: var(--color-text); display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .qty-selector { display: flex; align-items: center; border: 1px solid var(--color-border); border-radius: var(--radius); width: fit-content; }
    .qty-selector button { background: none; border: none; color: var(--color-text); width: 38px; height: 42px; }
    .qty-selector input { width: 44px; text-align: center; background: none; border: none; color: var(--color-text); font-size: 0.95rem; }
    .pd-actions { display: flex; align-items: center; gap: 14px; margin: 18px 0; flex-wrap: wrap; }
    .pd-tabs-content { border-top: 1px solid var(--color-border); padding-top: 18px; margin-top: 18px; }
    .pd-tabs-content h4 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-chrome-dim); margin-bottom: 8px; }
    .pd-tabs-content p { color: var(--color-text-muted); font-size: 0.92rem; margin-bottom: 14px; }
  </style>
