<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consolidados Activos — Maison Zadaca</title>
  <meta name="description" content="Compras grupales de perfumes importados a precio preferencial. Revisa las campañas activas y reserva tu perfume antes del cierre." />
  <link rel="canonical" href="https://lincolnhm.github.io/Zadaca/consolidados.html" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maison Zadaca" />
  <meta property="og:title" content="Consolidados Activos — Maison Zadaca" />
  <meta property="og:description" content="Compras grupales de perfumes importados a precio preferencial. Revisa las campañas activas y reserva tu perfume antes del cierre." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Inicio</a> / Consolidados</div>
        <h1>Compras Consolidadas</h1>
      </div>
    </div>

    <section class="section-tight">
      <div class="container">
        <p style="max-width:680px; color:var(--color-text-muted); font-size:0.95rem;">
          Un <strong style="color:var(--color-gold)">consolidado</strong> es una campaña de importación grupal: reserva tu perfume al precio preferencial y, al alcanzar el mínimo de unidades, lo importamos todos juntos para reducir costos.
        </p>
      </div>
    </section>

    <section class="section" style="padding-top:24px;">
      <div class="container">
        <div class="consolidado-grid reveal-grid" id="grid-consolidados"><div class="loading-state">Cargando consolidados…</div></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const ESTADOS_LEGIBLES = {
      Borrador: 'Próximamente', Abierto: 'Abierto', Cerrado_Procesando: 'Cerrado — Procesando',
      Comprado_En_Transito: 'En tránsito', En_Aduanas: 'En aduanas', En_Almacen_Local: 'En almacén local',
      Finalizado: 'Finalizado', Cancelado: 'Cancelado',
    };
    document.addEventListener('DOMContentLoaded', async () => {
      await iniciarLayout('consolidados.html');
      const mount = document.getElementById('grid-consolidados');
      if (!SUPABASE_CONFIGURADO) { mount.innerHTML = '<div class="empty-state">Configura Supabase en assets/js/supabase-config.js (ver README.md).</div>'; return; }
      try {
        const consolidados = (await obtenerConsolidados()).filter((c) => c.estado === 'Abierto');
        mount.innerHTML = consolidados.length ? consolidados.map(tarjetaConsolidadoCompleta).join('') : '<div class="empty-state">No hay consolidados abiertos por el momento. Vuelve pronto.</div>';
      } catch (err) {
        mount.innerHTML = `<div class="empty-state">${err.message}</div>`;
      }
    });
    function tarjetaConsolidadoCompleta(c) {
      const fechaCierre = new Date(c.fecha_cierre_programada);
      const cierre = fechaCierre.toLocaleDateString('es-PE', { day: 'numeric', month: 'long', year: 'numeric' });
      const diasRestantes = Math.ceil((fechaCierre.getTime() - Date.now()) / 86400000);
      const vigente = c.estado === 'Abierto' && diasRestantes > 0;
      const cuentaRegresiva = vigente
        ? ` &middot; <strong style="color:var(--color-gold)">${diasRestantes === 1 ? 'Cierra mañana' : `Quedan ${diasRestantes} días`}</strong>`
        : '';
      return `
        <a href="consolidado.html?id=${c.id}" class="consolidado-card">
          <span class="status-pill">${ESTADOS_LEGIBLES[c.estado] || c.estado}</span>
          <h3>${escapeHtml(c.codigo_campana)}</h3>
          <div class="cc-dates">Cierra el ${cierre}${cuentaRegresiva}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${c.porcentaje_avance}%"></div></div>
          <div class="progress-label"><span>${c.porcentaje_avance}% del mínimo alcanzado</span></div>
          <span class="link-arrow">Ver detalle &rarr;</span>
        </a>
      `;
    }
  </script>
</body>
</html>
