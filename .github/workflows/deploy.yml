name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      # El dominio sirve los archivos con caché de varias horas: sin esto, un visitante que ya
      # entró puede combinar un JS viejo con uno nuevo tras cada despliegue y ver la página rota.
      # Cada despliegue agrega ?v=<commit> a los JS/CSS propios, así el HTML nuevo siempre pide
      # el juego completo de archivos nuevos (no hay que acordarse de hacerlo a mano).
      - name: Versionar JS y CSS
        run: |
          VERSION="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s#(https://madisonzadaca\.com/assets/(js|css)/[A-Za-z0-9._-]+\.(js|css))([\"'])#\1?v=${VERSION}\4#g"
          grep -o "assets/js/api.js?v=[a-z0-9]*" index.html
      - name: Subir artefacto (sitio estático completo, sin build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
