<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consolidados Activos — Maison Zadaca</title>
  <meta name="description" content="Compras grupales de perfumes importados a precio preferencial. Revisa las campañas activas y reserva tu perfume antes del cierre." />
  <link rel="canonical" href="https://lincolnhm.github.io/Zadaca/consolidados/" />
  <link rel="icon" type="image/png" href="https://lincolnhm.github.io/Zadaca/assets/img/brand/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maison Zadaca" />
  <meta property="og:title" content="Consolidados Activos — Maison Zadaca" />
  <meta property="og:description" content="Compras grupales de perfumes importados a precio preferencial. Revisa las campañas activas y reserva tu perfume antes del cierre." />
  <meta property="og:url" content="https://lincolnhm.github.io/Zadaca/consolidados/" />
  <meta property="og:image" content="https://lincolnhm.github.io/Zadaca/assets/img/brand/logo-og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Consolidados Activos — Maison Zadaca" />
  <meta name="twitter:description" content="Compras grupales de perfumes importados a precio preferencial. Revisa las campañas activas y reserva tu perfume antes del cierre." />
  <meta name="twitter:image" content="https://lincolnhm.github.io/Zadaca/assets/img/brand/logo-og.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://lincolnhm.github.io/Zadaca/assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="https://lincolnhm.github.io/Zadaca/">Inicio</a> / Consolidados</div>
        <h1>Compras Consolidadas</h1>
      </div>
    </div>

    <section class="section-tight">
      <div class="container">
        <p style="max-width:680px; color:var(--color-text-muted); font-size:0.95rem;">
          Un <strong style="color:var(--color-gold)">consolidado</strong> es una campaña de importación grupal: reserva tu perfume al precio preferencial y, al alcanzar el mínimo de unidades, lo importamos todos juntos para reducir costos.
        </p>
      </div>
    </section>

    <section class="section" style="padding-top:24px;">
      <div class="container">
        <div class="consolidado-grid reveal-grid" id="grid-consolidados"><div class="loading-state">Cargando consolidados…</div></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/supabase-config.js" defer></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/api.js" defer></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/main.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await iniciarLayout('consolidados/');
      const mount = document.getElementById('grid-consolidados');
      if (!SUPABASE_CONFIGURADO) { mount.innerHTML = '<div class="empty-state">Configura Supabase en assets/js/supabase-config.js (ver README.md).</div>'; return; }
      try {
        const consolidados = (await obtenerConsolidados()).filter(consolidadoEstaAbierto);
        mount.innerHTML = consolidados.length ? consolidados.map(tarjetaConsolidado).join('') : '<div class="empty-state">No hay consolidados abiertos por el momento. Vuelve pronto.</div>';
      } catch (err) {
        mount.innerHTML = `<div class="empty-state">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
