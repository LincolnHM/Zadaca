<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Cuenta — Maison Zadaca</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .dash-layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }
    @media (max-width: 800px) { .dash-layout { grid-template-columns: 1fr; } }
    .dash-nav { display: flex; flex-direction: column; gap: 4px; }
    .dash-nav button { text-align: left; background: none; border: none; color: var(--color-text-muted); padding: 12px 14px; border-radius: var(--radius); font-size: 0.85rem; letter-spacing: 0.02em; }
    .dash-nav button.active { background: var(--color-bg-card); color: var(--color-gold); border-left: 2px solid var(--color-gold); }
    .dash-nav button:hover { color: var(--color-text); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .data-table th { text-align: left; color: var(--color-text-faint); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px; border-bottom: 1px solid var(--color-border); }
    .data-table td { padding: 14px 12px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
    .order-detail-row { background: var(--color-bg-card); }
    .status-tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 12px; background: rgba(188,186,194,0.15); color: var(--color-gold); }
    .direccion-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    .fav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    @media (max-width: 700px) { .fav-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Inicio</a> / Mi Cuenta</div>
        <h1 id="page-heading">Mi Cuenta</h1>
      </div>
    </div>
    <section class="section" id="cuenta-mount">
      <div class="container"><div class="loading-state">Cargando…</div></div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cuenta.js"></script>
</body>
</html>
