<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Perfumes — Maison Zadaca</title>
  <meta name="description" content="Explora el catálogo completo de perfumes importados originales: para hombre, mujer y unisex, en tienda o a precio consolidado." />
  <link rel="canonical" href="https://lincolnhm.github.io/Zadaca/catalogo.html" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maison Zadaca" />
  <meta property="og:title" content="Catálogo de Perfumes — Maison Zadaca" />
  <meta property="og:description" content="Explora el catálogo completo de perfumes importados originales: para hombre, mujer y unisex, en tienda o a precio consolidado." />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* ---------- Barra de filtros compacta ----------
       Antes: sidebar fijo de 240px con TODAS las marcas (29) y familias como radios
       siempre expandidos — en PC quedaba más alto que la grilla de productos, y en
       móvil (donde pasaba a position:static) se renderizaba entero antes de ver un
       solo perfume. Ahora los filtros viven colapsados en botones tipo dropdown
       dentro de una sola barra de herramientas; el mismo componente funciona igual
       en PC y en móvil (el panel flotante se ajusta al ancho de pantalla). */
    .catalog-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1 1 auto; }
    .toolbar-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .catalog-toolbar select { background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text); padding: 10px 14px; border-radius: var(--radius); font-size: 0.82rem; }

    .search-compact { flex: 1 1 200px; max-width: 260px; }
    .search-compact input {
      width: 100%; background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text);
      padding: 10px 16px; border-radius: 20px; font-size: 0.82rem; outline: none;
    }
    .search-compact input:focus { border-color: var(--color-gold); }

    .filter-dd { position: relative; }
    .filter-dd-btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 20px;
      border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text-muted);
      font-size: 0.78rem; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    }
    .filter-dd-btn:hover { color: var(--color-text); border-color: var(--color-gold-dim); }
    .filter-dd-btn .caret { font-size: 0.6rem; color: var(--color-text-faint); transition: transform 0.15s; flex-shrink: 0; }
    .filter-dd.open .filter-dd-btn .caret { transform: rotate(180deg); }
    .filter-dd.has-value .filter-dd-btn { border-color: var(--color-gold); color: var(--color-gold); }

    .filter-dd-panel {
      display: none; position: absolute; top: calc(100% + 10px); left: 0; width: 270px;
      max-width: min(320px, calc(100vw - 48px)); background: var(--color-bg-card); border: 1px solid var(--color-border);
      border-radius: var(--radius); box-shadow: var(--shadow-card); z-index: 250; padding: 14px;
    }
    .filter-dd.open .filter-dd-panel { display: block; }
    .filter-dd-search {
      width: 100%; margin-bottom: 10px; background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-text);
      padding: 8px 10px; border-radius: 3px; font-size: 0.8rem; outline: none;
    }
    .filter-dd-search:focus { border-color: var(--color-gold); }
    .filter-dd-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; }
    .filter-option { display: flex; align-items: center; gap: 9px; font-size: 0.85rem; padding: 7px 4px; margin: 0; border-radius: 3px; color: var(--color-text-muted); cursor: pointer; }
    .filter-option:hover { color: var(--color-text); background: rgba(217, 176, 84, 0.08); }
    .filter-option input { accent-color: var(--color-gold); flex-shrink: 0; }
    .filter-dd-empty { font-size: 0.78rem; color: var(--color-text-faint); padding: 6px 4px; }

    .active-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px; background: rgba(217, 176, 84, 0.1); color: var(--color-gold-light);
      border: 1px solid var(--color-gold-dim); padding: 6px 8px 6px 12px; border-radius: 20px; font-size: 0.74rem;
    }
    .chip button { display: flex; color: var(--color-gold-light); opacity: 0.75; font-size: 0.95rem; line-height: 1; }
    .chip button:hover { opacity: 1; }
    .chip-clear { background: none; border: 1px dashed var(--color-text-faint); color: var(--color-text-faint); padding: 6px 12px; border-radius: 20px; font-size: 0.74rem; }
    .chip-clear:hover { color: var(--color-text); border-color: var(--color-text-muted); }

    @media (max-width: 720px) {
      .toolbar-right { width: 100%; justify-content: space-between; margin-left: 0; }
      .search-compact { flex-basis: 100%; max-width: none; order: -1; }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Inicio</a> / Catálogo</div>
        <h1>Catálogo de Perfumes</h1>
      </div>
    </div>

    <section class="section-tight">
      <div class="container">
        <div class="pill-row" id="pill-generos">
          <button class="pill active" data-genero="">Todos</button>
          <button class="pill" data-genero="Hombre">Hombre</button>
          <button class="pill" data-genero="Mujer">Mujer</button>
          <button class="pill" data-genero="Unisex">Unisex</button>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0;">
      <div class="container">
        <form id="filter-form">
          <div class="catalog-toolbar">
            <div class="toolbar-filters">
              <div class="search-compact">
                <input type="text" name="busqueda" placeholder="Buscar perfume o marca..." />
              </div>
              <div class="filter-dd" id="dd-marca">
                <button type="button" class="filter-dd-btn">Marca <span class="caret">⌄</span></button>
                <div class="filter-dd-panel">
                  <input type="text" class="filter-dd-search" placeholder="Filtrar marcas..." />
                  <div class="filter-dd-list" id="filtro-marcas"></div>
                </div>
              </div>
              <div class="filter-dd" id="dd-familia">
                <button type="button" class="filter-dd-btn">Familia Olfativa <span class="caret">⌄</span></button>
                <div class="filter-dd-panel">
                  <div class="filter-dd-list" id="filtro-familias"></div>
                </div>
              </div>
            </div>
            <div class="toolbar-right">
              <span id="resultado-conteo" style="font-size:0.82rem; color:var(--color-text-faint);"></span>
              <select id="orden-select">
                <option value="recientes">Más recientes</option>
                <option value="precio_asc">Precio: menor a mayor</option>
                <option value="precio_desc">Precio: mayor a menor</option>
                <option value="nombre">Nombre A-Z</option>
              </select>
            </div>
          </div>
          <div class="active-chips" id="active-chips"></div>
        </form>

        <div class="product-grid" id="grid-catalogo"><div class="loading-state">Cargando productos…</div></div>
        <div class="pagination" id="paginacion"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/catalogo.js"></script>
</body>
</html>
