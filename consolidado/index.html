<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Consolidado — Maison Zadaca</title>
  <meta name="robots" content="noindex, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maison Zadaca" />
  <meta property="og:title" id="og-title" content="Consolidado — Maison Zadaca" />
  <meta property="og:description" id="og-description" content="Compra grupal de perfumes importados a precio preferencial." />
  <link rel="icon" type="image/png" href="https://lincolnhm.github.io/Zadaca/assets/img/brand/favicon.png" />
  <link rel="stylesheet" href="https://lincolnhm.github.io/Zadaca/assets/css/style.css" />
  <style>
    .consolidado-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: start; }
    @media (max-width: 900px) { .consolidado-layout { grid-template-columns: 1fr; } }
    .timeline { border-left: 2px solid var(--color-border); padding-left: 22px; }
    .timeline-item { position: relative; padding-bottom: 26px; }
    .timeline-item::before { content: ''; position: absolute; left: -28px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-gold); }
    .timeline-item .t-estado { font-weight: 600; font-size: 0.88rem; }
    .timeline-item .t-fecha { font-size: 0.72rem; color: var(--color-text-faint); margin-bottom: 4px; }
    .timeline-item p { font-size: 0.85rem; color: var(--color-text-muted); margin: 4px 0 0; }
    .reserva-panel { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 28px; position: sticky; top: 100px; }
    .participante-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-border); font-size: 0.85rem; }
    .participante-row:last-child { border-bottom: none; }

    /* ---------- Buscador de perfume (reemplaza el <select> de 48 opciones) ---------- */
    .combo-perfume { position: relative; }
    .combo-resultados {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 260px; overflow-y: auto;
      background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius);
      box-shadow: var(--shadow-card); z-index: 50;
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
    }
    .combo-resultados.open { opacity: 1; visibility: visible; transform: translateY(0); }
    .combo-opcion {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: none; border: none; border-bottom: 1px solid var(--color-border); color: var(--color-text-muted);
      padding: 10px 12px; font-size: 0.85rem;
    }
    .combo-opcion:last-child { border-bottom: none; }
    .combo-opcion:hover { background: rgba(122,32,48,0.08); color: var(--color-text); }
    .combo-opcion strong { color: var(--color-text); }
    .combo-precio { color: var(--color-gold); font-size: 0.8rem; flex-shrink: 0; }
    .combo-vacio { padding: 12px; font-size: 0.82rem; color: var(--color-text-faint); }

    /* ---------- Progreso de descuento por volumen (migración 0005) ---------- */
    .volumen-progreso { background: rgba(122,32,48,0.08); border: 1px solid var(--color-gold-dim); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; }
    .volumen-progreso-linea { font-size: 0.82rem; color: var(--color-text-muted); line-height: 1.5; }
    .volumen-progreso-linea + .volumen-progreso-linea { margin-top: 4px; }
    .volumen-progreso-linea strong { color: var(--color-text); }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="https://lincolnhm.github.io/Zadaca/">Inicio</a> / <a href="https://lincolnhm.github.io/Zadaca/consolidados/">Consolidados</a> / <span id="crumb-codigo">Detalle</span></div>
      </div>
    </div>
    <section class="section" id="detalle-mount">
      <div class="container"><div class="loading-state">Cargando consolidado…</div></div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/supabase-config.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/api.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/main.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/consolidado.js"></script>
</body>
</html>
