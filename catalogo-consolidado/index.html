<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Consolidado — Maison Zadaca</title>
  <meta name="description" content="Todo lo que traemos por consolidado, a precio preferencial: reserva tu perfume y se importa al alcanzar el mínimo de la campaña." />
  <link rel="canonical" href="https://lincolnhm.github.io/Zadaca/catalogo-consolidado/" />
  <link rel="icon" type="image/png" href="https://lincolnhm.github.io/Zadaca/assets/img/brand/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maison Zadaca" />
  <meta property="og:title" content="Catálogo Consolidado — Maison Zadaca" />
  <meta property="og:description" content="Todo lo que traemos por consolidado, a precio preferencial: reserva tu perfume y se importa al alcanzar el mínimo de la campaña." />
  <meta property="og:url" content="https://lincolnhm.github.io/Zadaca/catalogo-consolidado/" />
  <meta property="og:image" content="https://lincolnhm.github.io/Zadaca/assets/img/brand/logo-og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Catálogo Consolidado — Maison Zadaca" />
  <meta name="twitter:description" content="Todo lo que traemos por consolidado, a precio preferencial: reserva tu perfume y se importa al alcanzar el mínimo de la campaña." />
  <meta name="twitter:image" content="https://lincolnhm.github.io/Zadaca/assets/img/brand/logo-og.jpg" />
  <link rel="stylesheet" href="https://lincolnhm.github.io/Zadaca/assets/css/style.css" />
  <style>
    /* Mismo componente de barra de filtros compacta que https://lincolnhm.github.io/Zadaca/catalogo/ (ver ese archivo para
       el porqué del diseño) — se repite acá porque son dos páginas HTML independientes. */
    .catalog-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1 1 auto; }
    .toolbar-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .catalog-toolbar select { background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text); padding: 10px 14px; border-radius: var(--radius); font-size: 0.82rem; }

    .search-compact { position: relative; flex: 1 1 200px; max-width: 260px; }
    .search-compact input {
      width: 100%; background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text);
      padding: 10px 16px; border-radius: 20px; font-size: 0.82rem; outline: none;
    }
    .search-compact input:focus { border-color: var(--color-gold); }

    .search-suggest {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0; min-width: 280px;
      background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius);
      box-shadow: var(--shadow-card); z-index: 260; max-height: 380px; overflow-y: auto;
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
    }
    .search-suggest.open { opacity: 1; visibility: visible; transform: translateY(0); }
    .search-suggest-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer;
      color: var(--color-text); text-decoration: none;
    }
    .search-suggest-item:hover, .search-suggest-item.is-active { background: rgba(188,186,194,0.08); }
    .search-suggest-item img { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; background: var(--color-bg); flex-shrink: 0; }
    .search-suggest-item .fallback-icon { width: 34px; height: 34px; padding: 7px; box-sizing: border-box; color: var(--color-text-faint); flex-shrink: 0; }
    .search-suggest-item .ss-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .search-suggest-item .ss-marca { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-faint); }
    .search-suggest-item .ss-nombre { font-size: 0.82rem; color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-suggest-item .ss-precio { font-size: 0.78rem; color: var(--color-gold-light); flex-shrink: 0; white-space: nowrap; }
    .search-suggest-empty { padding: 14px 12px; font-size: 0.8rem; color: var(--color-text-faint); }
    .search-suggest-footer {
      display: block; width: 100%; text-align: left; padding: 10px 12px; font-size: 0.78rem;
      color: var(--color-gold-light); border: none; border-top: 1px solid var(--color-border); background: none; cursor: pointer;
    }
    .search-suggest-footer:hover { background: rgba(188,186,194,0.08); }

    .filter-dd { position: relative; }
    .filter-dd-btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 20px;
      border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text-muted);
      font-size: 0.78rem; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    }
    .filter-dd-btn:hover { color: var(--color-text); border-color: var(--color-gold-dim); }
    .filter-dd-btn .caret { font-size: 0.6rem; color: var(--color-text-faint); transition: transform 0.15s; flex-shrink: 0; }
    .filter-dd.open .filter-dd-btn .caret { transform: rotate(180deg); }
    .filter-dd.has-value .filter-dd-btn { border-color: var(--color-gold); color: var(--color-gold); }

    .filter-dd-panel {
      position: absolute; top: calc(100% + 10px); left: 0; width: 270px;
      max-width: min(320px, calc(100vw - 48px)); background: var(--color-bg-card); border: 1px solid var(--color-border);
      border-radius: var(--radius); box-shadow: var(--shadow-card); z-index: 250; padding: 14px;
      opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.98);
      transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
    }
    .filter-dd.open .filter-dd-panel { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .filter-dd-search {
      width: 100%; margin-bottom: 10px; background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-text);
      padding: 8px 10px; border-radius: 3px; font-size: 0.8rem; outline: none;
    }
    .filter-dd-search:focus { border-color: var(--color-gold); }
    .filter-dd-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; }
    .filter-option { display: flex; align-items: center; gap: 9px; font-size: 0.85rem; padding: 7px 4px; margin: 0; border-radius: 3px; color: var(--color-text-muted); cursor: pointer; }
    .filter-option:hover { color: var(--color-text); background: rgba(188,186,194,0.08); }
    .filter-option input { accent-color: var(--color-gold); flex-shrink: 0; }
    .filter-dd-empty { font-size: 0.78rem; color: var(--color-text-faint); padding: 6px 4px; }

    .active-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px; background: rgba(188,186,194,0.1); color: var(--color-gold-light);
      border: 1px solid var(--color-gold-dim); padding: 6px 8px 6px 12px; border-radius: 20px; font-size: 0.74rem;
    }
    .chip button { display: flex; color: var(--color-gold-light); opacity: 0.75; font-size: 0.95rem; line-height: 1; }
    .chip button:hover { opacity: 1; }
    .chip-clear { background: none; border: 1px dashed var(--color-text-faint); color: var(--color-text-faint); padding: 6px 12px; border-radius: 20px; font-size: 0.74rem; }
    .chip-clear:hover { color: var(--color-text); border-color: var(--color-text-muted); }

    @media (max-width: 720px) {
      .toolbar-right { width: 100%; justify-content: space-between; margin-left: 0; }
      .search-compact { flex-basis: 100%; max-width: none; order: -1; }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="https://lincolnhm.github.io/Zadaca/">Inicio</a> / Catálogo Consolidado</div>
        <h1>Catálogo Consolidado</h1>
      </div>
    </div>

    <section class="section-tight">
      <div class="container">
        <p style="max-width:680px; color:var(--color-text-muted); font-size:0.95rem; margin-bottom:0;">
          Todo lo que traemos por <strong style="color:var(--color-gold)">consolidado</strong>, sin importar el stock físico de la tienda: reserva al precio preferencial y se importa al alcanzar el mínimo de la campaña.
          <a href="https://lincolnhm.github.io/Zadaca/consolidados/" class="link-arrow">Ver campañas activas y fechas de cierre &rarr;</a>
        </p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="pill-row" id="pill-generos">
          <button class="pill active" data-genero="">Todos</button>
          <button class="pill" data-genero="Hombre">Hombre</button>
          <button class="pill" data-genero="Mujer">Mujer</button>
          <button class="pill" data-genero="Unisex">Unisex</button>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0;">
      <div class="container">
        <form id="filter-form">
          <div class="catalog-toolbar">
            <div class="toolbar-filters">
              <div class="search-compact">
                <input type="text" name="busqueda" placeholder="Buscar perfume o marca..." autocomplete="off" />
                <div class="search-suggest" id="search-suggest"></div>
              </div>
              <div class="filter-dd" id="dd-marca">
                <button type="button" class="filter-dd-btn">Marca <span class="caret">⌄</span></button>
                <div class="filter-dd-panel">
                  <input type="text" class="filter-dd-search" placeholder="Filtrar marcas..." />
                  <div class="filter-dd-list" id="filtro-marcas"></div>
                </div>
              </div>
              <div class="filter-dd" id="dd-casa">
                <button type="button" class="filter-dd-btn">Casa <span class="caret">⌄</span></button>
                <div class="filter-dd-panel">
                  <div class="filter-dd-list" id="filtro-casas"></div>
                </div>
              </div>
              <div class="filter-dd" id="dd-familia">
                <button type="button" class="filter-dd-btn">Familia Olfativa <span class="caret">⌄</span></button>
                <div class="filter-dd-panel">
                  <div class="filter-dd-list" id="filtro-familias"></div>
                </div>
              </div>
            </div>
            <div class="toolbar-right">
              <span id="resultado-conteo" style="font-size:0.82rem; color:var(--color-text-faint);"></span>
              <select id="orden-select">
                <option value="marca">Por marca</option>
                <option value="recientes">Más recientes</option>
                <option value="precio_asc">Precio: menor a mayor</option>
                <option value="precio_desc">Precio: mayor a menor</option>
                <option value="nombre">Nombre A-Z</option>
              </select>
            </div>
          </div>
          <div class="active-chips" id="active-chips"></div>
        </form>

        <div class="product-grid reveal-grid" id="grid-catalogo"><div class="loading-state">Cargando productos…</div></div>
        <div class="pagination" id="paginacion"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/supabase-config.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/api.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/main.js"></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/catalogo-consolidado.js"></script>
</body>
</html>
