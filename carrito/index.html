<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito — Maison Zadaca</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="https://lincolnhm.github.io/Zadaca/assets/img/brand/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://lincolnhm.github.io/Zadaca/assets/css/style.css" />
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 40px; align-items: start; }
    @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr; } }
    .cart-row { display: grid; grid-template-columns: 90px 1fr auto auto; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--color-border); }
    .cart-row .cr-media { width: 90px; height: 110px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; background: var(--color-media-bg); }
    .cart-row .cr-media img { max-width: 80%; max-height: 84%; object-fit: contain; }
    .cart-row .cr-name { font-family: var(--font-heading); font-size: 1.02rem; margin: 0 0 4px; }
    .cart-row .cr-meta { font-size: 0.75rem; color: var(--color-text-faint); }
    .cart-row .cr-qty { display: flex; align-items: center; border: 1px solid var(--color-border); border-radius: var(--radius); width: fit-content; }
    .cart-row .cr-qty button { background: none; border: none; color: var(--color-text); width: 30px; height: 32px; }
    .cart-row .cr-qty input { width: 34px; text-align: center; background: none; border: none; color: var(--color-text); }
    .cart-row .cr-remove { background: none; border: none; color: var(--color-text-faint); }
    .cart-row .cr-remove:hover { color: var(--color-danger); }
    /* Con las 4 columnas fijas del grid de arriba (90px 1fr auto auto), el nombre del producto
       quedaba muy apretado en un teléfono angosto -- acá se pasa a un layout más suelto: imagen
       + nombre arriba, cantidad y eliminar abajo, en la misma fila. */
    @media (max-width: 480px) {
      .cart-row { display: flex; flex-wrap: wrap; gap: 10px 14px; }
      .cart-row .cr-media { width: 64px; height: 78px; }
      .cart-row > div:nth-child(2) { flex: 1; min-width: 150px; }
      .cart-row .cr-qty { order: 3; }
      .cart-row .cr-remove { order: 4; margin-left: auto; }
    }
    .summary-panel { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 26px; position: sticky; top: 100px; }
    .summary-line { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--color-text-muted); margin-bottom: 12px; }
    .summary-total { display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700; padding-top: 14px; border-top: 1px solid var(--color-border); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="https://lincolnhm.github.io/Zadaca/">Inicio</a> / Carrito</div>
        <h1>Tu Carrito</h1>
      </div>
    </div>
    <section class="section" id="cart-mount">
      <div class="container"><div class="loading-state">Cargando carrito…</div></div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/supabase-config.js" defer></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/api.js" defer></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/main.js" defer></script>
  <script src="https://lincolnhm.github.io/Zadaca/assets/js/carrito.js" defer></script>
</body>
</html>
