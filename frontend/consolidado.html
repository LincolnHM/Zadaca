<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Consolidado — Maison Zadaca Importaciones</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .consolidado-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: start; }
    @media (max-width: 900px) { .consolidado-layout { grid-template-columns: 1fr; } }
    .timeline { border-left: 2px solid var(--color-border); padding-left: 22px; }
    .timeline-item { position: relative; padding-bottom: 26px; }
    .timeline-item::before { content: ''; position: absolute; left: -28px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); box-shadow: 0 0 10px rgba(201,168,106,0.5); }
    .timeline-item .t-estado { font-weight: 600; font-size: 0.88rem; }
    .timeline-item .t-fecha { font-size: 0.72rem; color: var(--color-text-faint); margin-bottom: 4px; }
    .timeline-item p { font-size: 0.85rem; color: var(--color-text-muted); margin: 4px 0 0; }
    .reserva-panel { background: var(--gradient-card); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 28px; position: sticky; top: 100px; box-shadow: var(--shadow-card); }
    .participante-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-border); font-size: 0.85rem; }
    .participante-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Inicio</a> / <a href="consolidados.html">Consolidados</a> / <span id="crumb-codigo">Detalle</span></div>
      </div>
    </div>

    <section class="section" id="detalle-mount">
      <div class="container"><div class="loading-state">Cargando consolidado…</div></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/consolidado.js"></script>
</body>
</html>
